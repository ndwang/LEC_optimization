strict: false
max_evaluations: 1600

generator:
  name: cnsga
  population_size: 32
  output_path: temp

evaluator:
  function: lec_opt.opt_sol
  function_kwargs: {}

vocs:
  variables:
    GSOL01: [0, 10]
    GSOL02: [0, 10]
    LI.SOL03: [0, 10]
    LI.SOL04: [0, 10]
  constraints:
    n_alive_ratio: [GREATER_THAN, 0.95]
  objectives:
    norm_emit_x: MINIMIZE
    norm_emit_y: MINIMIZE
  constants: {}
